
name: CI - FastAPI ML

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests Python
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: building_energy_test
      DB_USER: test_user
      DB_PASSWORD: test_password_ci_only

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executer les tests Pytest
        run: |
          python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85
