
name: CI - FastAPI ML

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests Python
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_ci_only
          POSTGRES_DB: building_energy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d building_energy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: building_energy_test
      DB_USER: test_user
      DB_PASSWORD: test_password_ci_only

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Creer les tables PostgreSQL
        run: |
          python -c "from app.database.models import Base; from app.database.connection import engine; Base.metadata.create_all(bind=engine)"

            - name: Executer les tests Pytest
        run: |
          python -m pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            --junitxml=pytest-results.xml \
            --cov-fail-under=85

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-couverture
          path: |
            htmlcov/
            coverage.xml
            pytest-results.xml
          if-no-files-found: warn
